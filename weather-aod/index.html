<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Weather AOD</title>
<style>
  :root { --fg:#d8d8d8; --dim:#7a7a7a; --faint:#3c3c3c; --accent:#8ab4ff; }
  * { box-sizing:border-box; margin:0; padding:0; }
  html,body { height:100%; background:#000; color:var(--fg); overflow:hidden;
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; -webkit-user-select:none; user-select:none; }
  /* Whole UI drifts a few px every minute so no pixel stays lit (burn-in protection). */
  #stage { position:absolute; inset:0; display:flex; flex-direction:column; justify-content:center;
    padding:max(4vmin,env(safe-area-inset-top)) 6vmin; transition:transform 4s ease-in-out; }
  #stage.night { --fg:#9a9a9a; --dim:#555; --faint:#2a2a2a; --accent:#5b7bb0; }
  #time { font-size:min(26vw,38vh); font-weight:200; letter-spacing:-.04em; line-height:1; font-variant-numeric:tabular-nums; }
  #date { font-size:min(4.5vw,5vh); color:var(--dim); margin-top:1vh; }
  .row { display:flex; align-items:center; gap:3vmin; margin-top:4vh; }
  #icon { font-size:min(14vw,16vh); line-height:1; filter:grayscale(.6); }
  #temp { font-size:min(16vw,20vh); font-weight:300; line-height:1; }
  #desc { font-size:min(5vw,5.5vh); color:var(--fg); }
  #meta { font-size:min(3.8vw,4vh); color:var(--dim); margin-top:.6vh; }
  #hourly { display:flex; gap:3vmin; margin-top:4vh; padding-top:2.5vh; border-top:1px solid var(--faint); }
  .h { flex:1; text-align:center; font-size:min(3.4vw,3.6vh); color:var(--dim); }
  .h b { display:block; font-weight:400; color:var(--fg); font-size:min(4.4vw,4.6vh); margin-top:.4vh; }
  .h span { display:block; font-size:min(5vw,5.4vh); margin:.4vh 0; filter:grayscale(.6); }
  #place { position:absolute; right:3vmin; bottom:2vmin; font-size:min(2.8vw,2.8vh); color:var(--faint); cursor:pointer; }
  #status { position:absolute; left:3vmin; bottom:2vmin; font-size:min(2.8vw,2.8vh); color:var(--faint); }
  @media (orientation:landscape) {
    #stage { display:grid; grid-template-columns:1fr 1fr; grid-template-rows:auto auto; align-content:center; column-gap:6vmin; }
    #time { font-size:min(20vw,36vh); } #date { grid-column:1; }
    .row { grid-column:2; grid-row:1 / span 2; margin-top:0; flex-direction:column; align-items:flex-start; justify-content:center; }
    #hourly { grid-column:1 / span 2; }
  }
</style>
</head>
<body>
<div id="stage">
  <div>
    <div id="time">--:--</div>
    <div id="date"></div>
  </div>
  <div class="row">
    <div id="icon">·</div>
    <div>
      <div id="temp">--°</div>
      <div id="desc">Loading weather…</div>
      <div id="meta"></div>
    </div>
  </div>
  <div id="hourly"></div>
</div>
<div id="status"></div>
<div id="place" title="Tap to change location / units"></div>

<script>
const $ = id => document.getElementById(id);
const store = { get(k,d){ try{ return JSON.parse(localStorage.getItem(k)) ?? d }catch{ return d } },
                set(k,v){ try{ localStorage.setItem(k, JSON.stringify(v)) }catch{} } };

let loc   = store.get('loc', null);          // {name, lat, lon}
let units = store.get('units', 'auto');      // 'auto' | 'c' | 'f'
if (units === 'auto') units = (navigator.language||'').startsWith('en-US') ? 'f' : 'c';

// WMO weather code -> [emoji day, emoji night, label]
const WMO = {0:['☀️','🌙','Clear'],1:['🌤️','🌙','Mostly clear'],2:['⛅','☁️','Partly cloudy'],3:['☁️','☁️','Overcast'],
  45:['🌫️','🌫️','Fog'],48:['🌫️','🌫️','Rime fog'],51:['🌦️','🌧️','Light drizzle'],53:['🌦️','🌧️','Drizzle'],55:['🌧️','🌧️','Heavy drizzle'],
  61:['🌦️','🌧️','Light rain'],63:['🌧️','🌧️','Rain'],65:['🌧️','🌧️','Heavy rain'],66:['🌧️','🌧️','Freezing rain'],67:['🌧️','🌧️','Freezing rain'],
  71:['🌨️','🌨️','Light snow'],73:['🌨️','🌨️','Snow'],75:['❄️','❄️','Heavy snow'],77:['🌨️','🌨️','Snow grains'],
  80:['🌦️','🌧️','Showers'],81:['🌧️','🌧️','Showers'],82:['⛈️','⛈️','Heavy showers'],85:['🌨️','🌨️','Snow showers'],86:['❄️','❄️','Snow showers'],
  95:['⛈️','⛈️','Thunderstorm'],96:['⛈️','⛈️','Thunderstorm, hail'],99:['⛈️','⛈️','Thunderstorm, hail']};
const wmo = (c,day)=>{ const w=WMO[c]||['·','·','—']; return {icon: day?w[0]:w[1], label:w[2]}; };

const t = v => Math.round(v) + '°';

// ---- clock -------------------------------------------------------------
let night = false;
function tick(){
  const d = new Date();
  $('time').textContent = d.toLocaleTimeString([], {hour:'numeric', minute:'2-digit'}).replace(/\s?[AP]M/i,'');
  $('date').textContent = d.toLocaleDateString([], {weekday:'long', month:'long', day:'numeric'});
  const h = d.getHours();
  night = h >= 22 || h < 6;               // extra-dim overnight
  $('stage').classList.toggle('night', night);
}
setInterval(tick, 1000); tick();

// ---- burn-in protection: small drift each minute ------------------------
function shift(){
  const r = () => Math.round((Math.random()*2-1) * 14);
  $('stage').style.transform = `translate(${r()}px, ${r()}px)`;
}
setInterval(shift, 60000); shift();

// ---- weather -----------------------------------------------------------
async function load(){
  if (!loc) return;
  const u = units==='f' ? '&temperature_unit=fahrenheit&wind_speed_unit=mph' : '&wind_speed_unit=kmh';
  const url = `https://api.open-meteo.com/v1/forecast?latitude=${loc.lat}&longitude=${loc.lon}`
    + `&current=temperature_2m,apparent_temperature,weather_code,is_day,wind_speed_10m,relative_humidity_2m`
    + `&hourly=temperature_2m,weather_code,is_day,precipitation_probability`
    + `&daily=temperature_2m_max,temperature_2m_min&forecast_days=2&timezone=auto${u}`;
  try {
    const r = await fetch(url); if(!r.ok) throw new Error(r.status);
    const j = await r.json();
    render(j);
    $('status').textContent = '';
  } catch(e){
    $('status').textContent = 'offline – showing last data';
  }
}

function render(j){
  const c = j.current, day = !!c.is_day, w = wmo(c.weather_code, day);
  const unitW = units==='f' ? 'mph' : 'km/h';
  $('icon').textContent = w.icon;
  $('temp').textContent = t(c.temperature_2m);
  $('desc').textContent = w.label;
  $('meta').textContent = `H ${t(j.daily.temperature_2m_max[0])}  L ${t(j.daily.temperature_2m_min[0])}  ·  Feels ${t(c.apparent_temperature)}  ·  ${Math.round(c.wind_speed_10m)} ${unitW}  ·  ${c.relative_humidity_2m}%`;
  // next 6 hours
  const now = j.current.time, i0 = Math.max(0, j.hourly.time.findIndex(x => x > now));
  $('hourly').innerHTML = '';
  for (let i=i0; i<i0+6 && i<j.hourly.time.length; i++){
    const d = new Date(j.hourly.time[i]);
    const hw = wmo(j.hourly.weather_code[i], !!j.hourly.is_day[i]);
    const p = j.hourly.precipitation_probability[i];
    const el = document.createElement('div'); el.className='h';
    el.innerHTML = `${d.toLocaleTimeString([], {hour:'numeric'}).toLowerCase()}<span>${hw.icon}</span><b>${t(j.hourly.temperature_2m[i])}</b>${p>=20?`<small style="color:var(--accent)">${p}%</small>`:''}`;
    $('hourly').appendChild(el);
  }
}

// ---- location ----------------------------------------------------------
$('place').textContent = loc ? loc.name : '';
async function geolocate(){
  return new Promise((res,rej)=> navigator.geolocation
    ? navigator.geolocation.getCurrentPosition(p=>res(p.coords), rej, {timeout:10000})
    : rej(new Error('no geolocation')));
}
async function reverseName(lat,lon){
  try{
    const r = await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${lat.toFixed(1)},${lon.toFixed(1)}&count=1`);
    return (await r.json()).results?.[0]?.name || `${lat.toFixed(2)}, ${lon.toFixed(2)}`;
  }catch{ return `${lat.toFixed(2)}, ${lon.toFixed(2)}`; }
}
async function setByName(){
  const q = prompt('City name:'); if(!q) return;
  try{
    const r = await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(q)}&count=1`);
    const g = (await r.json()).results?.[0];
    if(!g){ alert('City not found'); return; }
    loc = {name: [g.name, g.admin1, g.country_code].filter(Boolean).join(', '), lat:g.latitude, lon:g.longitude};
    store.set('loc', loc); $('place').textContent = loc.name; load();
  }catch{ alert('Lookup failed – check your connection'); }
}
$('place').addEventListener('click', ()=>{
  const choice = prompt('Type: 1 = change city, 2 = toggle °C/°F, 3 = use my location', '1');
  if(choice==='1') setByName();
  else if(choice==='2'){ units = units==='f'?'c':'f'; store.set('units',units); load(); }
  else if(choice==='3'){ init(true); }
});

async function init(force){
  if (!loc || force){
    try{
      const c = await geolocate();
      loc = {name: await reverseName(c.latitude,c.longitude), lat:c.latitude, lon:c.longitude};
      store.set('loc', loc); $('place').textContent = loc.name;
    }catch{ if(!loc) return setByName().then(load); }
  }
  load();
}
init();
setInterval(load, 15*60*1000);

// ---- keep screen on + fullscreen ---------------------------------------
let lock = null;
async function keepAwake(){
  try{ if('wakeLock' in navigator) lock = await navigator.wakeLock.request('screen'); }catch{}
}
document.addEventListener('visibilitychange', ()=>{ if(document.visibilityState==='visible'){ keepAwake(); load(); } });
document.addEventListener('dblclick', ()=>{
  if(!document.fullscreenElement) document.documentElement.requestFullscreen?.().catch(()=>{});
  else document.exitFullscreen?.();
  keepAwake();
});
keepAwake();
</script>
</body>
</html>
